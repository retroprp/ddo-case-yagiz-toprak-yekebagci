name: BakımPlan CI — Build, Test, Lint & Verify

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-ci:
    name: Backend (Go)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine3.20
        env:
          POSTGRES_USER: cmms_user
          POSTGRES_PASSWORD: cmms_secret_pass
          POSTGRES_DB: bakimplan_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://cmms_user:cmms_secret_pass@localhost:5432/bakimplan_db?sslmode=disable
      JWT_SECRET: ci-test-secret-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run Go Vet & Static Analysis (golangci-lint built with Go 1.26)
        working-directory: backend
        run: |
          go vet ./...
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run --timeout=3m ./...

      - name: Build API, Simulator & Verify binaries
        working-directory: backend
        run: |
          go build -v ./cmd/api
          go build -v ./cmd/simulator
          go build -v ./cmd/verify

      - name: Run unit & PostgreSQL integration tests (race detector)
        working-directory: backend
        run: go test -v -race ./...

  frontend-ci:
    name: Frontend (Vue)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        working-directory: frontend
        run: npm run build