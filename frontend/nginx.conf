server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── API ters vekil (reverse proxy) ──────────────────────────────────────
    #
    # Neden var: tarayıcı JS'i derleme anında API adresini içine gömer (Vite).
    # Adres mutlak yazılırsa (http://192.168.1.6:8080) şu sorunlar çıkar:
    #   - IP değişince (Wi-Fi ↔ Ethernet, DHCP) yeniden derlemek gerekir,
    #   - telefondan açıldığında o IP'ye erişilemezse uygulama çalışmaz,
    #   - tarayıcı farklı köken (origin) gördüğü için CORS devreye girer.
    #
    # Bu blok sayesinde arayüz göreli adres kullanır (/api/v1/...): istek
    # önce bu nginx'e gelir, nginx compose ağındaki backend'e iletir.
    #   - Aynı köken → CORS yok, preflight yok
    #   - Hangi IP/hostname ile açılırsa açılsın çalışır (telefon dahil)
    #   - Yalnızca 3000 portu açık olmalı; 8080'e dışarıdan gerek kalmaz
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ekipman ağacı ~565 KB dönebiliyor; sıkıştırma mobilde trafiği azaltır.
        gzip on;
        gzip_types application/json;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
